aid: noon
name: Noon
description: >-
  Noon is a Dubai-headquartered e-commerce marketplace and digital ecosystem
  launched in 2017 as a joint venture between Saudi Arabia's Public Investment
  Fund and Emirati businessman Mohamed Alabbar. Frequently described as the
  Amazon of the MENA region, Noon operates as the leading online shopping
  destination across the Kingdom of Saudi Arabia, the United Arab Emirates,
  and Egypt, offering electronics, mobiles, fashion, beauty, home, appliances,
  baby, and grocery categories through a hybrid first-party and third-party
  seller marketplace. Beyond the core marketplace, Noon has expanded into a
  lifestyle super-app spanning Noon Food (quick-service restaurant delivery
  competing with Talabat and Deliveroo), Noon Daily (next-day grocery
  delivery), Noon Minutes (15-minute instant grocery and essentials delivery),
  Noon Pay and the Noon mobile wallet (QR payments, bill pay, and a co-branded
  credit card), Noon VIP (loyalty/subscription), NowNow (on-demand delivery
  in KSA), and SIVVI (acquired regional fashion brand). Noon operates its own
  last-mile logistics arm and warehouses across the region, and provides a
  Fulfilled by Partner Integration (FBPI) program with commercial APIs that
  allow third-party sellers and channel-integration partners (ChannelEngine,
  Unicommerce, Vinculum, Ecom Energize and others) to programmatically
  publish catalog, sync inventory, and manage shipments. These APIs are
  gated to onboarded sellers and certified integrators inside the
  noon.partners environment — there is no general public developer portal,
  no published OpenAPI specification, and no Noon-maintained SDKs, CLIs,
  or open-source repositories.
